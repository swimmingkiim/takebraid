name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not integration" --strict-markers
      - run: python -m takebraid --version

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: takebraid --version

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Ensure media tools are available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # The Azure HTTP mirror has stalled downloads on hosted runners.
            # Keep Ubuntu's signed packages, using the official HTTPS archive.
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$source" ]; then
                sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
              fi
            done
            sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m integration --strict-markers --junitxml=workspace/media-validation-junit.xml
      - name: Run independent synthetic media matrix
        run: python -m tools.media_validation --output workspace/media-validation
      - name: Publish media validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-validation-ubuntu-24.04
          path: |
            workspace/media-validation-junit.xml
            workspace/media-validation/**/report.json
            workspace/media-validation/**/expected.json
            workspace/media-validation/**/result.json
            workspace/media-validation/**/generator-commands.json
          retention-days: 30
